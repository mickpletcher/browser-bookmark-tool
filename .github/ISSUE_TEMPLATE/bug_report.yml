name: Bug report
description: Report a reproducible problem on Windows or macOS
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove bookmark URLs, titles, usernames, local paths, tokens, and backup contents before submitting. Report security vulnerabilities privately through the Security tab.
  - type: checkboxes
    attributes:
      label: Safety checks
      options:
        - label: I removed private bookmark and profile data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    attributes:
      label: Browser Bookmark Tool version
      placeholder: 0.3.0 or commit SHA
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system and Python versions
      description: Include the macOS or Windows version and whether you ran from source or a standalone build.
      placeholder: macOS 15.6 with Python 3.13.3, or Windows 11 24H2 standalone executable
    validations:
      required: true
  - type: input
    attributes:
      label: Browser versions
      placeholder: Chrome 000, Edge 000, Firefox 000, Safari 00 when applicable
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Interface
      options:
        - Desktop GUI
        - Command line
        - Scheduled automation
        - Standalone executable
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Use placeholders for paths and bookmark data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and sanitized error text
    validations:
      required: true
