name: Accessibility barrier
description: Report a barrier in the GUI, CLI, documentation, or contribution process
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not share medical information, bookmark data, credentials, or private screenshots/logs. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: barrier
    attributes:
      label: Barrier and impact
      description: What task were you trying to complete? What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or sanitized examples only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App and OS versions, Python/Tcl/Tk if known, and optional assistive technology/version. No medical information is needed.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement or workaround
      description: Optional suggestions to make the task easier.
