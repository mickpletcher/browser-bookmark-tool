name: Cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m py_compile browser_bookmark_sync.py safari_adapter.py test_sync.py

      - name: CLI smoke test
        run: python -m browser_bookmark_sync --help

      - name: Check installed dependencies
        run: python -m pip check

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name BrowserBookmarkTool browser_bookmark_sync.py

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BrowserBookmarkTool-windows
          path: dist/BrowserBookmarkTool.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Test and build macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test and lint
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m py_compile browser_bookmark_sync.py safari_adapter.py test_sync.py
          python -m browser_bookmark_sync --help
          ./run-browser-bookmark-tool.sh --help

      - name: Build native executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name BrowserBookmarkTool browser_bookmark_sync.py

      - name: Smoke test native executable
        run: ./dist/BrowserBookmarkTool --help
