name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m py_compile browser_bookmark_sync.py test_sync.py

      - name: CLI smoke test
        run: python -m browser_bookmark_sync --help

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name BrowserBookmarkTool browser_bookmark_sync.py

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BrowserBookmarkTool-windows
          path: dist/BrowserBookmarkTool.exe
          if-no-files-found: error
