[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-bookmark-tool"
version = "0.3.0"
description = "Back up and safely synchronize Chrome and Edge bookmarks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mick Pletcher"}]
license = "MIT"
dependencies = []
keywords = ["bookmarks", "chrome", "edge", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pyinstaller>=6.21,<7", "ruff>=0.16.2,<0.17"]
release = ["cyclonedx-bom>=7.3.1,<8", "pyinstaller>=6.21,<7"]

[project.scripts]
browser-bookmark-tool = "browser_bookmark_sync:main"

[project.urls]
Homepage = "https://github.com/mickpletcher/browser-bookmark-tool"
Issues = "https://github.com/mickpletcher/browser-bookmark-tool/issues"
Changelog = "https://github.com/mickpletcher/browser-bookmark-tool/blob/main/changelog.md"
Security = "https://github.com/mickpletcher/browser-bookmark-tool/security/policy"
Privacy = "https://github.com/mickpletcher/browser-bookmark-tool/blob/main/PRIVACY.md"
"Code signing policy" = "https://github.com/mickpletcher/browser-bookmark-tool/blob/main/CODE_SIGNING_POLICY.md"

[tool.setuptools]
py-modules = ["browser_bookmark_sync"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
